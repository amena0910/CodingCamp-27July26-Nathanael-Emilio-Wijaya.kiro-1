<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily To Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting ===== -->
  <header class="greeting-section">
    <div class="greeting-left">
      <p id="greeting-text" class="greeting-text">Good Morning!</p>
      <div class="greeting-name-row">
        <span class="greeting-name-label">Hello, </span>
        <span id="greeting-name" class="greeting-name">there</span>
        <span class="greeting-name-label"> 👋</span>
        <button id="edit-name-btn" class="edit-name-btn" aria-label="Edit your name" title="Edit name">✏️</button>
      </div>
      <p id="greeting-date" class="greeting-date"></p>
    </div>
    <div class="greeting-right">
      <span id="greeting-time" class="greeting-time"></span>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
        <span class="theme-icon" id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="main-container">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card timer-section">
      <h2 class="card-title">Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="timer-start">Start</button>
        <button class="btn btn-secondary" id="timer-stop">Stop</button>
        <button class="btn btn-ghost" id="timer-reset">Reset</button>
      </div>
      <p class="timer-label" id="timer-label">Ready to focus?</p>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card todo-section">
      <h2 class="card-title">To Do List</h2>

      <!-- Add Task Form -->
      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="Add a new task..."
          maxlength="120"
        />
        <button class="btn btn-primary" id="todo-add-btn">Add</button>
      </div>

      <!-- Task Filter Tabs -->
      <div class="todo-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>

      <!-- Task List -->
      <ul class="todo-list" id="todo-list">
        <!-- items injected by JS -->
      </ul>

      <p class="todo-empty" id="todo-empty">No tasks yet. Add one above!</p>
      <p class="todo-count" id="todo-count"></p>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card links-section">
      <h2 class="card-title">Quick Links</h2>

      <!-- Add Link Form -->
      <div class="links-input-group">
        <input
          type="text"
          id="link-name-input"
          class="todo-input"
          placeholder="Label (e.g. YouTube)"
          maxlength="40"
        />
        <input
          type="url"
          id="link-url-input"
          class="todo-input"
          placeholder="URL (e.g. https://youtube.com)"
        />
        <button class="btn btn-primary" id="link-add-btn">Add Link</button>
      </div>

      <!-- Links Grid -->
      <div class="links-grid" id="links-grid">
        <!-- items injected by JS -->
      </div>

      <p class="todo-empty" id="links-empty">No quick links yet. Add one above!</p>
    </section>

  </main>

  <!-- ===== EDIT NAME MODAL ===== -->
  <div class="modal-overlay" id="name-modal" aria-modal="true" role="dialog" aria-labelledby="name-modal-title">
    <div class="modal">
      <h3 id="name-modal-title">What's your name?</h3>
      <p class="modal-subtitle">I'll use it to personalise your greeting.</p>
      <input type="text" id="name-input" class="todo-input" placeholder="Enter your name..." maxlength="40" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="name-save-btn">Save</button>
        <button class="btn btn-ghost" id="name-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div class="modal-overlay" id="edit-modal" aria-modal="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">Edit Task</h3>
      <input type="text" id="edit-input" class="todo-input" maxlength="120" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="edit-save-btn">Save</button>
        <button class="btn btn-ghost" id="edit-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
